# TC-SHOP-04 · "Add to cart" updates the cart and resets the selector
appId: com.idealplant.app
---
- extendedWaitUntil:
    visible:
      id: "shop_quantity_plus_button"
      index: 0
    timeout: 10000

- tapOn:
    id: "shop_quantity_plus_button"
    index: 0

- tapOn:
    id: "shop_add_to_cart_button"
    index: 0
